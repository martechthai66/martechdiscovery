<!doctype html><html lang="th" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>เข้าสู่ระบบ | MarTech Discovery Platform</title><link rel="stylesheet" href="/styles.css"><style>
body{background:#f2f7fc;color:#172b4d}.auth-wrap{max-width:520px;margin:7vh auto;padding:20px}.auth-card{background:white;border:1px solid #dbe6f2;border-radius:20px;padding:30px;box-shadow:0 12px 40px #17385b12}.auth-card h1{margin:12px 0;font-size:clamp(32px,7vw,44px);line-height:1.3;letter-spacing:-.02em}.auth-card h2{font-size:26px;line-height:1.35}.auth-card label{display:block;margin:14px 0;font-weight:650}.auth-card input{width:100%;margin-top:6px;padding:13px;border:1px solid #ccd9e7;border-radius:10px;font:inherit}.auth-card .button{width:100%;justify-content:center;margin-top:8px}.auth-error{color:#ae2c32;min-height:24px}.auth-note{color:#586d84;font-size:14px}
</style></head><body><main class="auth-wrap"><a class="brand" href="/th/"><span class="brandmark"><img src="/assets/platform-discovery-mark.png" alt=""></span><span>MARTECH<br><b>DISCOVERY</b></span></a><section class="auth-card"><span class="badge">MEMBER ACCOUNT</span><div id="login-panel"><h1>เข้าสู่ระบบ</h1><p class="auth-note">เข้าสู่บัญชีเพื่อเก็บรายการ MarTech ที่สนใจ หรือเปิดพื้นที่หลังบ้านตามสิทธิ์ของคุณ</p><form id="login-form"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><p class="auth-error" id="login-error" role="alert"></p><button class="button" type="submit">เข้าสู่ระบบ →</button></form></div><div id="change-panel" hidden><h1>ตั้งรหัสผ่านใหม่</h1><p class="auth-note">รหัสผ่านชั่วคราวใช้ได้เฉพาะการเข้าสู่ระบบครั้งแรก กรุณาตั้งรหัสผ่านใหม่อย่างน้อย 8 ตัวอักษร</p><form id="change-form"><label>รหัสผ่านใหม่<input name="password" type="password" autocomplete="new-password" required minlength="8"></label><label>ยืนยันรหัสผ่าน<input name="confirm" type="password" autocomplete="new-password" required minlength="8"></label><p class="auth-error" id="change-error" role="alert"></p><button class="button">บันทึกรหัสผ่านใหม่ →</button></form></div></section></main><script>
const $=s=>document.querySelector(s);async function post(path,body){const r=await fetch(path,{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({...body,locale:document.documentElement.lang||'th'})}),text=await r.text();let d;try{d=JSON.parse(text)}catch{throw Error(`Server error (${r.status}). Please retry or contact the platform team.`)}if(!r.ok)throw Error(d.error||`Request failed (${r.status})`);return d}$('#login-form').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));try{const out=await post('/api/auth/login',data);location.href=out.redirect}catch(err){$('#login-error').textContent=err.message}};async function showChange(){try{const r=await fetch('/api/member/me',{credentials:'same-origin'});if(!r.ok)return;const d=await r.json();if(d.user.mustChangePassword){location.replace(`/${document.documentElement.lang||'th'}/change-password/`)}}catch{}}$('#change-form').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));try{await post('/api/auth/password',data);location.href='/admin/'}catch(err){$('#change-error').textContent=err.message}};showChange();
</script></body></html>
