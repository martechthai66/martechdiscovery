<!doctype html><html lang="th" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>เปลี่ยนรหัสผ่านชั่วคราว | MarTech Discovery Platform</title><link rel="stylesheet" href="/styles.css"><style>
body{background:#f2f7fc;color:#172b4d}.auth-wrap{max-width:560px;margin:8vh auto;padding:20px}.auth-card{background:#fff;border:1px solid #dbe6f2;border-radius:20px;padding:30px;box-shadow:0 12px 40px #17385b12}.auth-card h1{font-size:clamp(30px,6vw,42px);line-height:1.3;margin:14px 0}.auth-card p{color:#586d84;line-height:1.7}.auth-card label{display:block;margin:15px 0;font-weight:650}.auth-card input{width:100%;margin-top:6px;padding:13px;border:1px solid #ccd9e7;border-radius:10px;font:inherit}.auth-card .button{width:100%;justify-content:center;margin-top:8px}.auth-error{color:#ae2c32;min-height:24px}
</style></head><body><main class="auth-wrap"><a class="brand" href="/th/"><span class="brandmark"><img src="/assets/platform-discovery-mark.png" alt=""></span><span>MARTECH<br><b>DISCOVERY</b></span></a><section class="auth-card"><span class="badge">FIRST SIGN-IN</span><h1>ตั้งรหัสผ่านใหม่</h1><p>ล็อกอินด้วยรหัสผ่านชั่วคราวสำเร็จแล้ว กรุณาตั้งรหัสผ่านใหม่อย่างน้อย 8 ตัวอักษรก่อนเข้าสู่ระบบ</p><div id="status" aria-live="polite"></div><form id="change-form"><label>รหัสผ่านใหม่<input name="password" type="password" autocomplete="new-password" required minlength="8"></label><label>ยืนยันรหัสผ่าน<input name="confirm" type="password" autocomplete="new-password" required minlength="8"></label><p class="auth-error" id="change-error" role="alert"></p><button class="button" type="submit">บันทึกรหัสผ่านใหม่ →</button></form></section></main><script>
const locale=document.documentElement.lang==='en'?'en':'th',go=path=>location.replace(`/${locale}/${path}/`);async function request(path,body){const r=await fetch(path,{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),text=await r.text();let d;try{d=JSON.parse(text)}catch{throw Error(`Server error (${r.status}). Please retry.`)}if(!r.ok)throw Error(d.error||`Request failed (${r.status})`);return d}async function init(){try{const r=await fetch('/api/member/me',{credentials:'same-origin'});if(r.status===401){go('login');return}const d=await r.json();if(!r.ok)throw Error(d.error||'Could not verify account');if(!d.user.mustChangePassword){go(d.user.role==='member'?'member':'admin');return}if(locale==='en'){document.querySelector('h1').textContent='Set a new password';document.querySelector('.auth-card>p').textContent='Your temporary password worked. Set a new password with at least 8 characters before continuing.';document.querySelectorAll('label')[0].childNodes[0].textContent='New password';document.querySelectorAll('label')[1].childNodes[0].textContent='Confirm password';document.querySelector('button[type=submit]').textContent='Save new password →';document.querySelector('.brand').href='/en/'} }catch(e){document.querySelector('#status').textContent=e.message}}document.querySelector('#change-form').onsubmit=async e=>{e.preventDefault();const form=Object.fromEntries(new FormData(e.currentTarget));try{await request('/api/auth/password',form);const r=await fetch('/api/member/me',{credentials:'same-origin'}),d=await r.json();location.href=d.user.role==='member'?`/${locale}/member/`:'/admin/'}catch(error){document.querySelector('#change-error').textContent=error.message}};init();
</script></body></html>
